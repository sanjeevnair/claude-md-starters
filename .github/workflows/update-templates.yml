name: Sync templates to Tulzu

on:
  push:
    branches: [main]
    paths:
      - 'templates/**'          # Only runs when a template file changes
  workflow_dispatch:             # Manual trigger

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync templates to tulzu.com
        env:
          TULZU_PAT: ${{ secrets.TULZU_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_tulzu.py
